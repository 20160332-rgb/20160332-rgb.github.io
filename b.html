<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>다문화 이해 유형 테스트</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: "Pretendard", sans-serif;
      background: linear-gradient(135deg,#dbeafe,#fdf4ff);
      min-height:100vh;
      color:#222;
    }

    .main{
      width:90%;
      max-width:850px;
      margin:auto;
      padding:40px 0;
    }

    .intro{
      background:white;
      border-radius:25px;
      padding:50px 40px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      margin-bottom:30px;
    }

    .intro h1{
      font-size:42px;
      color:#2563eb;
      margin-bottom:15px;
    }

    .intro p{
      font-size:18px;
      color:#555;
      line-height:1.6;
    }

    .start-btn{
      margin-top:30px;
      padding:15px 40px;
      border:none;
      border-radius:50px;
      background:#2563eb;
      color:white;
      font-size:20px;
      cursor:pointer;
      transition:0.3s;
    }

    .start-btn:hover{
      background:#1d4ed8;
      transform:scale(1.05);
    }

    .question-box{
      display:none;
      background:white;
      border-radius:25px;
      padding:40px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .progress{
      width:100%;
      height:14px;
      background:#e5e7eb;
      border-radius:30px;
      overflow:hidden;
      margin-bottom:30px;
    }

    .progress-bar{
      height:100%;
      width:0%;
      background:linear-gradient(to right,#2563eb,#9333ea);
      transition:0.4s;
    }

    .question-number{
      color:#666;
      margin-bottom:10px;
      font-size:15px;
    }

    .question{
      font-size:28px;
      font-weight:bold;
      margin-bottom:35px;
      line-height:1.5;
    }

    .answers{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .answer-btn{
      padding:18px;
      border:none;
      border-radius:18px;
      background:#f3f4f6;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      text-align:left;
    }

    .answer-btn:hover{
      background:#dbeafe;
      transform:translateY(-2px);
    }

    .result-box{
      display:none;
      background:white;
      border-radius:25px;
      padding:50px 40px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .result-type{
      font-size:48px;
      font-weight:bold;
      color:#7c3aed;
      margin:20px 0;
    }

    .result-title{
      font-size:28px;
      color:#2563eb;
      margin-bottom:20px;
    }

    .result-desc{
      font-size:18px;
      line-height:1.8;
      color:#444;
      margin-bottom:30px;
    }

    .retry-btn{
      padding:15px 35px;
      border:none;
      border-radius:50px;
      background:#7c3aed;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    .retry-btn:hover{
      background:#6d28d9;
    }

    @media(max-width:700px){
      .question{
        font-size:22px;
      }

      .intro h1{
        font-size:32px;
      }

      .result-type{
        font-size:38px;
      }
    }
  </style>
</head>
<body>
<!-- 상단 버튼 영역 -->
<div align="center" style="margin-bottom:25px;">

  <a href="index.html">
    <button
      onmouseover="this.style.transform='scale(1.1)'"
      onmouseout="this.style.transform='scale(1)'"
      style="
        background:linear-gradient(135deg,#2563eb,#7c3aed);
        color:white;
        border:none;
        padding:12px 24px;
        border-radius:30px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
        box-shadow:0 5px 12px rgba(0,0,0,0.2);
      ">
      🏠 메인 사이트로 돌아가기
    </button>
  </a>

</div>
<div class="main">

  <!-- 시작 화면 -->
  <div class="intro" id="intro">
    <h1>🌍 다문화 이해 유형 테스트</h1>

    <p>
      당신은 다양한 문화를 얼마나 이해하고 공감할 수 있을까요?<br>
      MBTI 스타일 질문으로 알아보는 나의 다문화 감수성!
    </p>

    <button class="start-btn" onclick="startTest()">
      테스트 시작하기
    </button>
  </div>

  <!-- 질문 -->
  <div class="question-box" id="questionBox">

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-number" id="questionNumber"></div>

    <div class="question" id="question"></div>

    <div class="answers" id="answers"></div>

  </div>

  <!-- 결과 -->
  <div class="result-box" id="resultBox">

    <h2>당신의 유형은...</h2>

    <div class="result-type" id="resultType"></div>

    <div class="result-title" id="resultTitle"></div>

    <div class="result-desc" id="resultDesc"></div>

    <button class="retry-btn" onclick="location.reload()">
      다시 테스트하기
    </button>

  </div>

</div>

<script>

const questions = [

{
  q:"외국 문화를 접했을 때 나는?",
  a:[
    ["새로운 점을 배우는 게 재미있다",3],
    ["그냥 흥미롭다",2],
    ["낯설어서 불편하다",1]
  ]
},

{
  q:"학교에 외국인 친구가 온다면?",
  a:[
    ["먼저 다가가 말을 건다",3],
    ["기회가 생기면 친해진다",2],
    ["조용히 지켜본다",1]
  ]
},

{
  q:"다른 나라 음식을 보면?",
  a:[
    ["바로 도전해본다",3],
    ["익숙한 음식이면 먹는다",2],
    ["거의 먹지 않는다",1]
  ]
},

{
  q:"문화 차이로 갈등이 생기면?",
  a:[
    ["서로 이해하려 노력한다",3],
    ["상황에 따라 다르다",2],
    ["내 방식이 더 중요하다",1]
  ]
},

{
  q:"외국어를 배우는 것에 대해?",
  a:[
    ["다른 문화를 이해할 수 있어 좋다",3],
    ["필요하면 배운다",2],
    ["굳이 필요성을 못 느낀다",1]
  ]
},

{
  q:"세계 축제나 전통 행사에 대해?",
  a:[
    ["직접 참여해보고 싶다",3],
    ["영상으로 보는 건 좋다",2],
    ["별 관심 없다",1]
  ]
},

{
  q:"다른 문화의 가치관을 들으면?",
  a:[
    ["존중하려고 노력한다",3],
    ["이해는 하지만 낯설다",2],
    ["내 가치관이 더 중요하다",1]
  ]
},

{
  q:"다문화 가정 친구에 대한 생각은?",
  a:[
    ["모두 똑같이 존중받아야 한다",3],
    ["특별히 다르진 않다",2],
    ["어색하게 느껴질 수 있다",1]
  ]
},

{
  q:"해외 여행을 간다면?",
  a:[
    ["현지 문화를 적극 체험한다",3],
    ["유명 관광지만 간다",2],
    ["익숙한 장소만 찾는다",1]
  ]
},

{
  q:"세계 여러 나라를 배우는 이유는?",
  a:[
    ["다양한 사람을 이해하기 위해",3],
    ["학교 공부니까",2],
    ["굳이 배울 필요는 없다",1]
  ]
},

{
  q:"인터넷에서 다른 문화 관련 논쟁을 보면?",
  a:[
    ["서로의 입장을 이해하려 한다",3],
    ["중립적으로 본다",2],
    ["내 기준으로 판단한다",1]
  ]
},

{
  q:"다문화 사회가 되면?",
  a:[
    ["더 풍부한 사회가 될 수 있다",3],
    ["장단점이 모두 있다",2],
    ["혼란이 생길 것 같다",1]
  ]
}

];

let current = 0;
let score = 0;

function startTest(){
  document.getElementById("intro").style.display="none";
  document.getElementById("questionBox").style.display="block";
  showQuestion();
}

function showQuestion(){

  let q = questions[current];

  document.getElementById("questionNumber").innerHTML =
    `Q ${current+1} / ${questions.length}`;

  document.getElementById("question").innerHTML = q.q;

  let answersHTML = "";

  q.a.forEach(answer=>{
    answersHTML += `
      <button class="answer-btn"
      onclick="selectAnswer(${answer[1]})">
      ${answer[0]}
      </button>
    `;
  });

  document.getElementById("answers").innerHTML = answersHTML;

  let progress = ((current)/questions.length)*100;
  document.getElementById("progressBar").style.width =
    progress + "%";
}

function selectAnswer(point){

  score += point;
  current++;

  if(current < questions.length){
    showQuestion();
  }else{
    showResult();
  }
}

function showResult(){

  document.getElementById("questionBox").style.display="none";
  document.getElementById("resultBox").style.display="block";

  let type = "";
  let title = "";
  let desc = "";

  if(score >= 32){

    type = "GMEF";
    title = "글로벌 공감 외교관형 🌎";

    desc =
    "당신은 다양한 문화를 열린 마음으로 받아들이는 유형입니다. " +
    "다른 사람의 배경과 가치관을 존중하며, 서로의 차이를 연결하는 능력이 뛰어납니다. " +
    "새로운 문화 경험을 즐기고 세계 시민 의식이 강한 편입니다.";

  }else if(score >= 24){

    type = "COBF";
    title = "문화 공감 탐험가형 ✈️";

    desc =
    "당신은 다른 문화를 이해하려는 태도를 가진 사람입니다. " +
    "새로운 경험을 긍정적으로 받아들이며 다양한 사람들과 어울릴 가능성이 높습니다. " +
    "조금 더 많은 경험을 한다면 더욱 넓은 시각을 가질 수 있습니다.";

  }else{

    type = "SAFE";
    title = "안정 추구 관찰자형 🧭";

    desc =
    "당신은 익숙한 환경을 더 편하게 느끼는 유형입니다. " +
    "다른 문화가 낯설 수 있지만, 다양한 사람들과의 경험을 통해 " +
    "점차 이해의 폭을 넓혀갈 수 있습니다.";
  }

  document.getElementById("resultType").innerHTML = type;
  document.getElementById("resultTitle").innerHTML = title;
  document.getElementById("resultDesc").innerHTML = desc;
}

</script>

</body>
</html>
