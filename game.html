<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파리 피하기 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui">
    <h1>🪰 파리 피하기</h1>

    <div>
        ❤️ 생명 : <span id="life">1</span>
        ⏱️ 시간 : <span id="time">0</span>
    </div>

    <button id="start">게임 시작</button>
</div>


<div id="gameOver">
    <h2>게임 오버!</h2>
    <p id="result"></p>
    <button onclick="startGame()">다시하기</button>
</div>

<div id="game">

    <div id="floor"></div>
    <div id="player"></div>

</div>

<div id="controls">
    <button id="leftBtn">◀ 왼쪽</button>
    <button id="rightBtn">오른쪽 ▶</button>
</div>
<script src="script.js"></script>

</body>
</html>
